<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAMBi 3D Kinetic Arch Mascot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    header {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 2px 8px;
      background: rgba(217, 119, 6, 0.2);
      border: 1px solid rgba(217, 119, 6, 0.4);
      color: #f59e0b;
      border-radius: 4px;
    }
    p.subtitle {
      font-size: 0.875rem;
      color: #8b949e;
      margin-top: 4px;
    }
    #mascot-container {
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    #mascot-container:active {
      cursor: grabbing;
    }
    .controls-hint {
      position: absolute;
      bottom: 24px;
      font-size: 0.8rem;
      color: #6e7681;
      pointer-events: none;
      background: rgba(13, 17, 23, 0.8);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <header>
    <h1>KAMBi 3D Mascot <span class="badge">Kinetic Arch</span></h1>
    <p class="subtitle">Official 3D Arch & Data Constellation Mascot</p>
  </header>

  <div id="mascot-container"></div>
  <div class="controls-hint">Move mouse to tilt • Interactive 3D Canvas</div>

  <script>
    const container = document.getElementById('mascot-container');
    const scene = new THREE.Scene();
    const width = window.innerWidth;
    const height = window.innerHeight;

    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.set(0, 0, 7.5);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(5, 8, 6);
    scene.add(keyLight);

    const emberBeaconLight = new THREE.PointLight(0xd97706, 4.0, 10);
    emberBeaconLight.position.set(0, -0.9, 0.4);
    scene.add(emberBeaconLight);

    const rimLight = new THREE.DirectionalLight(0xb45309, 1.8);
    rimLight.position.set(-6, -4, -4);
    scene.add(rimLight);

    // Root Mascot Group
    const mascotGroup = new THREE.Group();
    scene.add(mascotGroup);

    // Procedural Arch Geometry
    const curvePoints = [
      new THREE.Vector3(0, 2.2, 0),
      new THREE.Vector3(1.1, 1.4, 0.1),
      new THREE.Vector3(1.4, 0.2, 0.2),
      new THREE.Vector3(1.1, -1.2, 0.1),
      new THREE.Vector3(0.5, -1.5, 0),
      new THREE.Vector3(-0.5, -1.5, 0),
      new THREE.Vector3(-1.1, -1.2, -0.1),
      new THREE.Vector3(-1.4, 0.2, -0.2),
      new THREE.Vector3(-1.1, 1.4, -0.1),
      new THREE.Vector3(0, 2.2, 0),
    ];
    const archCurve = new THREE.CatmullRomCurve3(curvePoints, true);
    const archGeometry = new THREE.TubeGeometry(archCurve, 128, 0.18, 24, true);

    const archMaterial = new THREE.MeshStandardMaterial({
      color: 0x1f242d,
      roughness: 0.25,
      metalness: 0.85,
    });
    const archMesh = new THREE.Mesh(archGeometry, archMaterial);
    mascotGroup.add(archMesh);

    // Core Amber Beacon
    const beaconGeometry = new THREE.SphereGeometry(0.42, 32, 32);
    const beaconMaterial = new THREE.MeshStandardMaterial({
      color: 0xd97706,
      emissive: 0xd97706,
      emissiveIntensity: 0.9,
      roughness: 0.15,
      metalness: 0.4,
    });
    const beaconMesh = new THREE.Mesh(beaconGeometry, beaconMaterial);
    beaconMesh.position.set(0, -0.9, 0.2);
    mascotGroup.add(beaconMesh);

    // White Aperture Core Dot
    const coreDotGeo = new THREE.SphereGeometry(0.16, 24, 24);
    const coreDotMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const coreDotMesh = new THREE.Mesh(coreDotGeo, coreDotMat);
    coreDotMesh.position.set(0, -0.9, 0.52);
    mascotGroup.add(coreDotMesh);

    // Constellation Particle Cloud
    const particleCount = 140;
    const particleGeo = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    const particleScales = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      const radius = 1.8 + Math.random() * 2.4;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(Math.random() * 2 - 1);

      particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
      particlePositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
      particlePositions[i * 3 + 2] = radius * Math.cos(phi);
      particleScales[i] = Math.random() * 0.05 + 0.02;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0xf59e0b,
      size: 0.08,
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending,
    });
    const particleSystem = new THREE.Points(particleGeo, particleMat);
    scene.add(particleSystem);

    // Interactive Mouse Tracking
    let targetRotX = 0;
    let targetRotY = 0;
    let currentRotX = 0;
    let currentRotY = 0;

    window.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth) - 0.5;
      const y = (e.clientY / window.innerHeight) - 0.5;
      targetRotY = x * 1.2;
      targetRotX = y * 0.8;
    });

    // Touch support
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        const x = (e.touches[0].clientX / window.innerWidth) - 0.5;
        const y = (e.touches[0].clientY / window.innerHeight) - 0.5;
        targetRotY = x * 1.2;
        targetRotX = y * 0.8;
      }
    });

    // Animation Loop
    const startTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = (performance.now() - startTime) * 0.001;

      currentRotX += (targetRotX - currentRotX) * 0.06;
      currentRotY += (targetRotY - currentRotY) * 0.06;

      mascotGroup.rotation.x = currentRotX + Math.sin(elapsed * 0.8) * 0.05;
      mascotGroup.rotation.y = currentRotY + Math.cos(elapsed * 0.6) * 0.08;
      mascotGroup.position.y = Math.sin(elapsed * 1.4) * 0.12;

      const beaconScale = 1.0 + Math.sin(elapsed * 3.0) * 0.08;
      beaconMesh.scale.set(beaconScale, beaconScale, beaconScale);
      emberBeaconLight.intensity = 3.5 + Math.sin(elapsed * 3.0) * 1.5;

      particleSystem.rotation.y = elapsed * 0.08;
      particleSystem.rotation.x = elapsed * 0.03;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
